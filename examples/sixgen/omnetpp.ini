[General]
record-eventlog = false
num-rngs = 3
**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2
tkenv-plugin-path = ../../../etc/plugins
# channel physical parameters
**.wlan[*].typename = "AckingWirelessInterface"
#**.wlan[*].bitrate = 2Mbps
**.wlan[*].mac.headerLength = 23B
**.wlan[*].radio.typename = "UnitDiskRadio"
**.wlan[*].radio.transmitter.headerLength = 96b
**.wlan[*].radio.transmitter.interferenceRange = 10m
**.wlan[*].radio.transmitter.detectionRange = 100m
**.wlan[*].radio.receiver.ignoreInterference = false
# lifecycle
**.hasStatus = true

[Config simpleNetwork]
network = inet.examples.sixgen.simpleNetwork
repeat = 35
seed-set = ${repetition}
**.networkType = ${net="CAIN"} #CAIN EECRM LAR SC SPRAY BRAP
*.numHost = ${nHost=100}#${nHost=60..100 step 10}
*.numOfSats = 0
*.numIrs = 128
*.numAntenna = 0
*.numDrone = 20
*.sprayFraction = 2
**.updateInterval = 20s   # Interval to update the satellite positions on the map


# don't send arp messages
*.*.ipv4.arp.typename = "GlobalArp"

# ping app settings
*.irs[*].numApps = 1
*.irs[*].app[0].typename = "PingApp"
*.irs[*].app[0].destAddr = "*"
*.irs[*].app[0].sendInterval = 0.5s
*.irs[*].wlan[*].radio.antenna.typename = "ParabolicAntenna"
*.irs[*].wlan[*].radio.antenna.beamWidth = 30deg
*.irs[*].wlan[*].radio.antenna.maxGain = 10dB
*.irs[*].wlan[*].radio.antenna.minGain = -50dB
*.irs[*].wlan[*].radio.transmitter.communicationRange = 500m

*.irs[*].mobility.typename = "StaticLinearMobility"
*.irs[*].mobility.separation=0m
*.irs[*].mobility.initialZ = 15m  # Metade da altura do prédio

